name: credit-study
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-yf90o7]
    paths: [scripts/credit_study.py, .github/workflows/credit-study.yml]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/credit_study.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/credit_study.json
          git diff --cached --quiet || git commit -m "study: credit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
