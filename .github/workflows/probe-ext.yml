name: probe-ext
on:
  push:
    branches: [claude/project-thread-lcotj6]
    paths: [scripts/probe_ext.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/probe_ext.py
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add -f data/probe_ext.json; git commit -m "probe" || true
          git pull --rebase origin ${{ github.ref_name }}; git push origin HEAD:${{ github.ref_name }}
