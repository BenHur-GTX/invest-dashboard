name: liq-raw
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-d1lfb0]
    paths: [scripts/liq_raw.py, .github/workflows/liq-raw.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/liq_raw.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/liq_raw.json
          git diff --cached --quiet || git commit -m "data: liq_raw"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
