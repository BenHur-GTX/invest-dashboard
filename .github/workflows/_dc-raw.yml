name: dc-raw (temp)
on:
  push:
    branches: [claude/project-thread-5ijv3y]
    paths: [scripts/_dc_raw.py, .github/workflows/_dc-raw.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/_dc_raw.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/_dc_raw.json
          git diff --cached --quiet || git commit -m "data: _dc_raw (temp)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
