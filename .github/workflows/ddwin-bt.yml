name: ddwin-backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/backtest_portfolio.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ONLY_DDWIN: "1"
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ddwin_bt.json
          git diff --cached --quiet || git commit -m "backtest: ddwin"
          git pull --rebase origin main
          git push
