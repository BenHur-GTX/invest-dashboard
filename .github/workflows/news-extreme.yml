name: news-extreme
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-f20stj]
    paths: [scripts/news_extreme.py, .github/workflows/news-extreme.yml]
permissions:
  contents: write
concurrency:
  group: news-extreme
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/news_extreme.py
      - if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/news_extreme_study.json
          git diff --cached --quiet || git commit -m "study: news extreme"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
