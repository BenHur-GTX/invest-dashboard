name: ext-quotes
# 11-20 Ben: 미국 장외(장전·장후·야간) 시세 + 나스닥·S&P 선물 15분마다 (정규장 시간은 update-data 담당, 스크립트가 알아서 건너뜀)
on:
  schedule:
    - cron: "5,20,35,50 0-14 * * 1-5"    # 한국 낮~밤: 야간 거래·장전
    - cron: "5,20,35,50 20-23 * * 1-5"   # 장후·야간 시작
    - cron: "5,20,35,50 0 * * 6"         # 금요일 장후 마지막 1시간(겨울)
    - cron: "5,20,35,50 22-23 * * 0"     # 일요일 선물 개장
  workflow_dispatch:
  push:
    branches: [claude/project-thread-lcotj6]
    paths: [scripts/ext_quotes.py, .github/workflows/ext-quotes.yml]
permissions:
  contents: write
concurrency:
  group: ext-quotes
  cancel-in-progress: true
jobs:
  ext:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/ext_quotes.py
        env:
          FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ext.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "ext: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); done
