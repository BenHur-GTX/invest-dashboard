name: probe-kr
on:
  push:
    branches: [claude/project-thread-dtaczx]
    paths: [scripts/probe_kr.py, .github/workflows/probe-kr.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u scripts/probe_kr.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
