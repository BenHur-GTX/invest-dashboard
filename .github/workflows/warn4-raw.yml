name: warn4-raw
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-qxfrnl]
    paths: [scripts/warn4_raw.py, .github/workflows/warn4-raw.yml]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/warn4_raw.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/warn4_raw.json
          git diff --cached --quiet || git commit -m "raw: warn4"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
