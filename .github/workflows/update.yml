name: update-data
on:
  schedule:
    # 미국 장중 15분마다 (UTC 13:30~21:00, 평일) + 장 마감 후 1회 + 한국 장 마감 후 1회
    - cron: "*/15 13-20 * * 1-5"
    - cron: "15 21 * * 1-5"
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd
      - name: Build data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FORCE_SENT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_BT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python -u scripts/build_data.py
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/market.json data/backtest.json data/sentiment_hist.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
