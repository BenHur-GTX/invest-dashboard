name: park-backtest
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-dtaczx]
    paths: [scripts/backtest_portfolio.py, .github/workflows/park-bt.yml]
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/backtest_portfolio.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ONLY_PARK: "1"
          ONLY_PARKV: "1"
          ONLY_SWING: "1"
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/park_bt.json data/park_verify.json data/swing_bt.json
          git diff --cached --quiet || git commit -m "backtest: park"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
