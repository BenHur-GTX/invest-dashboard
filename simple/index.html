<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Dashboard 단순안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--ink:#1c1c1a;--ink2:#55534e;--line:#e3e1db;--brand:#0f3d3e;--brand-soft:#e3eded;--accent:#b54708;--accent-soft:#fdf0e6;--ok:#1f7a4d;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:#fff;padding:16px 0 18px}
header h1{font-size:19px;margin:0}
header .meta{font-size:12px;color:#c9dcdc;margin-top:2px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border-radius:var(--r);overflow:hidden;margin-top:14px}
.hero>div{background:var(--brand);padding:10px 14px}.hero .k{font-size:12px;color:#b8d0d0}.hero .v{font-size:21px;font-weight:700}.hero .s{font-size:12px;color:#d7e6e6}
main{padding:8px 0 40px}
h2{font-size:17px;margin:26px 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:500;background:#faf9f6}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.on td{background:var(--accent-soft);font-weight:700}
tr.acct td{background:var(--brand-soft)}
tr.total td{font-weight:700;background:#faf9f6}
.muted{color:var(--ink2);font-size:13px}
.note{font-size:13px;color:var(--ink2);margin:8px 2px 0}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inputs label{font-size:13px;color:var(--ink2);display:block}
.inputs .in{display:flex;align-items:center;gap:6px;margin-top:4px;white-space:nowrap}
input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:right;background:#fff;transition:border-color .15s ease,box-shadow .15s ease}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ok{color:var(--ok);font-weight:700}
.lead{font-size:16px;margin:0}
@media (max-width:560px){.pxc{display:none}.hero{grid-template-columns:1fr 1fr}.hero>div:first-child{grid-column:1/-1}.inputs{grid-template-columns:1fr}th,td{padding:7px 6px;font-size:13px}}
</style></head><body>
<header><div class="wrap"><h1>Stock Dashboard 단순안 <span style="font-size:12px;font-weight:500;background:#f4b37a;color:#1c1c1a;border-radius:4px;padding:1px 6px;vertical-align:2px">백업</span></h1>
<div class="meta" id="meta">불러오는 중…</div><div class="hero" id="hero"></div></div></header>
<main class="wrap" id="app"></main>
<script>
const $=s=>document.querySelector(s);
const won=v=>v>=1e4? (Math.round(v/1e3)/10).toLocaleString("ko-KR")+"만원" : Math.round(v).toLocaleString("ko-KR")+"원";
const pct=(v,d=1)=>(v>0?"+":"")+v.toFixed(d)+"%";
// 하락 단계별 245만 비율 (2026-11-08 Ben 단순안, 백테스트 P2)
const LADDER=[
  {dd:0,   label:"평상 (고점 −10% 이내)", w:{SCHD:40,SPYM:40,QQQM:20}},
  {dd:-10, label:"−10% 이하", w:{SCHD:20,SPYM:30,QQQM:40,QLD:10}},
  {dd:-15, label:"−15% 이하", w:{SCHD:10,SPYM:20,QQQM:50,QLD:20}},
  {dd:-20, label:"−20% 이하", w:{SPYM:10,QQQM:50,QLD:40}},
  {dd:-30, label:"−30% 이하", w:{QQQM:40,QLD:60}},
];
const CASH=[{n:1,dd:-25,p:5,mix:"QQQM 80 + QLD 20"},{n:2,dd:-30,p:10,mix:"QQQM 70 + QLD 30"},{n:3,dd:-35,p:15,mix:"QQQM 60 + QLD 40"},{n:4,dd:-40,p:15,mix:"QQQM 50 + QLD 50"},{n:5,dd:-50,p:25,mix:"QLD 80 + QQQM 20"},{n:6,dd:-60,p:30,mix:"QLD 80 + TQQQ 20"}];
const KR={SCHD:["458730","TIGER 미국배당다우존스"],SPYM:["360750","TIGER 미국S&P500"],QQQM:["133690","TIGER 미국나스닥100"],QLD:["133690","TIGER 미국나스닥100"]};
const CFG_KEY="simple_cfg", DEF={lt:200,pn:45,cash:85};
function cfg(){ try{ return {...DEF, ...JSON.parse(localStorage.getItem(CFG_KEY)||"{}")}; }catch(e){ return {...DEF}; } }
let M=null;
function stageIdx(dd){ let k=0; LADDER.forEach((s,i)=>{ if(dd<=s.dd) k=i; }); return k; }
function render(){
  const S=M.symbols, q=S.QQQ, fx=M.fx.usdkrw, dd=q.dd5y, c=cfg();
  const si=stageIdx(dd), st=LADDER[si];
  const vix=S["^VIX"]?.price, fng=M.fng?.score;
  const aux=[["QQQ RSI ≤ 40",q.rsi!=null&&q.rsi<=40,q.rsi?.toFixed(1)],["VIX ≥ 20",vix!=null&&vix>=20,vix?.toFixed(1)],["공포탐욕 ≤ 45",fng!=null&&fng<=45,fng??"–"],["60·120·200일선 터치",!!(q.touch&&(q.touch.ma60||q.touch.ma120||q.touch.ma200)),""],["볼린저 하단 이탈",!!q.bb_break,""]];
  const auxN=aux.filter(a=>a[1]).length;
  const cashStep=CASH.filter(t=>dd<=t.dd).pop();
  $("#meta").textContent=`시세 갱신 ${new Date(M.generated).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} · 원/달러 ${fx.toFixed(1)}`;
  $("#hero").innerHTML=`<div><div class="k">QQQ 5년 고점 대비</div><div class="v">${pct(dd)}</div><div class="s">지금 단계: ${st.label}</div></div>
    <div><div class="k">현금 단계</div><div class="v">${cashStep? cashStep.n+"차 구간":"대기"}</div><div class="s">${cashStep? "보조지표 "+auxN+"/5":"−25%부터 투입"}</div></div>
    <div><div class="k">QQQ RSI · VIX</div><div class="v">${q.rsi?.toFixed(1)??"–"} · ${vix?.toFixed(1)??"–"}</div><div class="s">공포탐욕 ${fng??"–"}</div></div>`;
  const usd=t=>S[t]?.price, kr=t=>S[KR[t][0]]?.price;
  const ltRows=Object.entries(st.w).map(([t,w])=>{const amt=c.lt*1e4*w/100, px=usd(t); return {t,w,amt,px:px? "$"+px.toFixed(2):"–", sh:px? Math.floor(amt/fx/px):"–"};});
  const pnMap={}; Object.entries(st.w).forEach(([t,w])=>{ const k=KR[t][0]; pnMap[k]=(pnMap[k]||0)+w; });
  const pnRows=Object.entries(pnMap).map(([k,w])=>{const amt=c.pn*1e4*w/100, px=S[k]?.price; const name=Object.values(KR).find(x=>x[0]===k)[1]; return {t:name,w,amt,px:px? Math.round(px).toLocaleString("ko-KR")+"원":"–", sh:px? Math.floor(amt/px):"–"};});
  const G=(c.lt+c.pn+c.cash)*1e4;
  const rows=(rs)=>rs.map(r=>`<tr><td>${r.t}</td><td>${r.w}%</td><td>${won(r.amt)}</td><td class="pxc">${r.px}</td><td>${r.sh}</td></tr>`).join("");
  $("#app").innerHTML=`
  <h2>이번 달 매수</h2>
  <div class="panel"><div class="inputs">
    <div><label for="i_lt">장투 (미국 ETF)</label><div class="in"><input id="i_lt" type="number" inputmode="numeric" min="0" step="1" value="${c.lt}"><span>만원</span></div></div>
    <div><label for="i_pn">연금저축 (국내상장)</label><div class="in"><input id="i_pn" type="number" inputmode="numeric" min="0" step="1" value="${c.pn}"><span>만원</span></div></div>
    <div><label for="i_cash">현금 (SGOV)</label><div class="in"><input id="i_cash" type="number" inputmode="numeric" min="0" step="1" value="${c.cash}"><span>만원</span></div></div>
  </div><p class="note">입력하면 바로 바뀌고 이 기기에 저장됩니다.</p></div>
  <div class="tbl" style="margin-top:12px"><table>
    <tr><th>종목</th><th>비중</th><th>금액</th><th class="pxc">현재가</th><th>주수</th></tr>
    <tr class="acct"><td colspan="2"><b>장투</b> <span class="muted">${st.label}</span></td><td colspan="3"><b>${won(c.lt*1e4)}</b></td></tr>${rows(ltRows)}
    <tr class="acct"><td colspan="2"><b>연금저축</b> <span class="muted">QLD 몫은 나스닥100</span></td><td colspan="3"><b>${won(c.pn*1e4)}</b></td></tr>${rows(pnRows)}
    <tr class="acct"><td colspan="2"><b>현금</b> <span class="muted">SGOV에 모으기</span></td><td colspan="3"><b>${won(c.cash*1e4)}</b></td></tr>
    <tr><td>SGOV</td><td>100%</td><td>${won(c.cash*1e4)}</td><td class="pxc">${usd("SGOV")? "$"+usd("SGOV").toFixed(2):"–"}</td><td>${usd("SGOV")? Math.floor(c.cash*1e4/fx/usd("SGOV")):"–"}</td></tr>
    <tr class="total"><td>전체 합계</td><td></td><td>${won(G)}</td><td></td><td></td></tr>
  </table></div>
  <p class="note">25일 전후 1회 매수. 주수는 1주 단위 내림입니다. 배당 몫(SCHD)은 원하면 JEPI·DIVO·JEPQ로 바꿔도 됩니다.</p>
  <h2>하락 단계별 비율 (장투·연금 적립분)</h2>
  <div class="tbl"><table><tr><th>QQQ 낙폭</th><th>배당</th><th>SPYM</th><th>QQQM</th><th>QLD</th></tr>
  ${LADDER.map((s,i)=>`<tr${i===si?' class="on"':""}><td>${s.label}</td>${["SCHD","SPYM","QQQM","QLD"].map(t=>`<td>${s.w[t]??"–"}</td>`).join("")}</tr>`).join("")}
  </table></div>
  <p class="note">QQQ가 5년 고점의 −1% 이내로 돌아오면 보유 QLD 전부를 QQQM으로 바꿉니다(레버리지를 들고 다음 폭락을 맞지 않기 위해). 보유분은 그 외에는 팔지 않습니다.</p>
  <h2>현금 투입 (모아 둔 SGOV)</h2>
  <div class="tbl"><table><tr><th>차수</th><th>QQQ 낙폭</th><th>투입</th><th>매수</th></tr>
  ${CASH.map(t=>`<tr${cashStep&&t.n===cashStep.n?' class="on"':""}><td>${t.n}차</td><td>${t.dd}%</td><td>모은 돈의 ${t.p}%</td><td>${t.mix}</td></tr>`).join("")}
  </table></div>
  <p class="note">해당 낙폭에 처음 닿은 뒤 아래 보조지표 중 2개가 맞는 날 3~5거래일에 나눠 삽니다. 전고점을 되찾으면 매수분 절반은 SGOV로, 절반은 장투로 옮깁니다.</p>
  <div class="panel" style="margin-top:10px">${aux.map(a=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${a[0]}</span><span class="${a[1]?"ok":"muted"}">${a[1]?"충족":"아님"}${a[2]? " · "+a[2]:""}</span></div>`).join("")}</div>
  <h2>이 안의 성적 (백테스트)</h2>
  <div class="panel"><p class="lead">연 14.4% (메인 규칙 15.0%), 원금 대비 최악 손실 닷컴 −47% · 금융위기 −8% · 코로나 −19% · 금리인상 −7%.</p>
  <p class="note">위기 고점에서 시작해 2026년 11월까지, 원화·세전. SCHD 자료가 2011년부터라 그 전 배당 몫은 S&P500으로 대신해 배당의 하락 방어가 덜 반영됐습니다. 메인 대시보드가 기준이고 이 화면은 백업입니다. <a href="../">메인으로</a></p></div>`;
  ["lt","pn","cash"].forEach(k=>$("#i_"+k).addEventListener("input",()=>{ const n=cfg(); n[k]=Math.max(0,Math.round(+$("#i_"+k).value||0)); localStorage.setItem(CFG_KEY,JSON.stringify(n)); const pos=$("#i_"+k).selectionStart; render(); const el=$("#i_"+k); el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} }));
}
fetch("../data/market.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(m=>{M=m;render();}).catch(e=>{$("#app").innerHTML=`<p>시세를 불러오지 못했습니다: ${e.message}</p>`;});
</script></body></html>
