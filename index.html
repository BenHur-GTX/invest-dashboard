<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d3e">
<title>Stock Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#1c1c1a; --ink2:#55534e; --line:#e3e1db;
  --brand:#0f3d3e; --brand-soft:#e3eded; --accent:#b54708; --accent-soft:#fdf0e6;
  --up:#c62828; --down:#1d4ed8; --ok:#1f7a4d; --warn:#a15c00; --bad:#b42318;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header{background:var(--brand);color:#fff}
header .wrap{padding-top:14px;padding-bottom:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.top .meta{font-size:12px;color:#c9dcdc}
.hero{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:1px;background:rgba(255,255,255,.14);margin:14px 0 0;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.hero>div{background:var(--brand);padding:12px 14px}
.hero .k{font-size:12px;color:#b8d0d0}
.hero .v{font-size:20px;font-weight:700;margin-top:2px}
.hero .s{font-size:12px;color:#d7e6e6}
.hero .state .v{font-size:24px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.14)}
.stages>div{background:var(--brand);padding:8px 14px;font-size:12.5px;color:#d7e6e6;line-height:1.45}
.stages b{color:#fff;font-weight:600}
.stages .lv{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;margin:0 4px;background:rgba(255,255,255,.12);color:#fff}
.stages .lv.buy{background:#f4b37a;color:#3a1d05}.stages .lv.hot{background:#ff9b9b;color:#3a0505}
.stages .nx{color:#b8d0d0}
@media (max-width:860px){.stages{grid-template-columns:1fr}}
nav{position:sticky;top:0;z-index:5;background:var(--brand);border-top:1px solid rgba(255,255,255,.14)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav .wrap::-webkit-scrollbar{display:none}
nav a{color:#cfe0e0;text-decoration:none;padding:12px 12px 10px;font-size:14px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s ease,border-color .15s ease}
nav a:hover{color:#fff}
nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
nav a[aria-current="page"]{color:#fff;border-bottom-color:#f4b37a}
nav a.key{color:#f8d3ae;font-weight:700}
nav a.key:hover,nav a.key[aria-current="page"]{color:#fff}
nav a.key-last{margin-right:10px;position:relative}
nav a.key-last::after{content:"";position:absolute;right:-6px;top:12px;bottom:12px;width:1px;background:rgba(255,255,255,.28)}
main{padding-top:18px}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.2px}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--ink2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.lead{font-size:16px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.alert{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:6px;font-size:14px}
.alert.bad{border-color:var(--bad);background:#fdecea}
.alert.info{border-color:var(--brand);background:var(--brand-soft)}
.alert b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:500;background:#faf9f6;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table tr:last-child td{border-bottom:0}
.tbl td.l:first-child{min-width:150px}
tr.total td{font-weight:700;background:#faf9f6}
.qtbl .tk{font-weight:600}
.qtbl .why{display:inline-block;font-size:12px;line-height:1.4;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.qtbl tr.acct td{background:#faf9f6;border-top:2px solid var(--line)}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;background:var(--brand);color:#fff}
.scard header b{font-size:16px}.scard header span{font-size:12px;opacity:.92;text-align:right}
.scard.now{border:2px solid var(--accent)}.scard.now header{background:var(--accent)}
.scard dl{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;margin:0;padding:9px 12px 11px;font-size:14px;line-height:1.45}
.scard dt{font-weight:700;color:var(--brand);font-size:13px}.scard dd{margin:0}
/* 휴대폰: 표를 행 카드로 (11-14 Ben: 가로 스크롤 없이 한 화면에). 열 제목은 각 값 앞에 작은 글씨로 */
@media (max-width:640px){
  .tbl table.stack{min-width:0!important}
  table.stack, table.stack tbody{display:block}
  table.stack tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.stack tr.hd{gap:4px 6px;padding:6px 10px;background:#faf9f6}
  table.stack tr.hd th{display:none;position:static;padding:0;border:0;background:none}
  table.stack tr.hd th.sortable{display:block}
  table.stack tr.hd:not(:has(th.sortable)){display:none}
  table.stack td{display:block;padding:0;border:0;text-align:left;white-space:normal;min-width:0!important}
  table.stack td:first-child{flex:1 0 100%;font-weight:600}
  table.stack td.wide{flex:1 0 100%}
  table.stack td[data-label]::before{content:attr(data-label);display:inline;margin-right:5px;font-size:11.5px;font-weight:400;color:var(--ink2)}
  table.stack td:empty{display:none}
  table.stack td{background:none!important;box-shadow:none!important}
  table.stack tr.total{background:#faf9f6}
  table.stack tr.buy2{background:#e6f2eb;box-shadow:inset 4px 0 0 var(--ok)}
  table.stack tr.buy1{background:#f3f8f4;box-shadow:inset 4px 0 0 #8cbf5a}
  table.stack tr.hot{background:#fdf1ef;box-shadow:inset 4px 0 0 var(--bad)}
  table.stack tr[style*="accent-soft"]{box-shadow:inset 4px 0 0 var(--accent)}
  .qtbl td.l{white-space:normal}
  .qtbl .why{white-space:normal;display:inline}
  .qtbl td:first-child{min-width:0}
}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qtiles>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.qtiles .k{font-size:12px;color:var(--ink2)}.qtiles .v{font-size:20px;font-weight:700;margin:2px 0}.qtiles .m{font-size:12.5px;color:var(--ink2)}
@media (max-width:640px){.qtiles{grid-template-columns:1fr 1fr}}

.sumtbl tr.acct td{background:var(--brand-soft);border-top:2px solid var(--line)}
.sumtbl td:not(.l),.sumtbl th:not(.l){white-space:nowrap}
@media (max-width:520px){.sumtbl td,.sumtbl th{padding:7px 6px;font-size:13px}.sumtbl td.l .muted{display:block;font-size:12px}}
.sigrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.sigrow:last-child{border-bottom:0}
.hp{padding:4px 16px}
.hrow{padding:11px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .h1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hrow .hst{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.hrow .hv{margin-top:3px;font-variant-numeric:tabular-nums}
.hrow .hn{font-size:12.5px;color:var(--ink2);margin-top:2px}
.hrow .hu{font-size:12.5px;color:var(--brand);margin-top:2px;font-weight:500}
.hsum{display:block;margin:12px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:inherit;text-decoration:none;font-size:13.5px;transition:border-color .15s ease}
.hsum:hover{border-color:var(--brand)}
.hsum:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sigrow .sk{flex:1;min-width:0}
.sigrow .sv{text-align:right;font-variant-numeric:tabular-nums;max-width:48%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.kpis>div{background:var(--surface);padding:12px 14px}
.kpis .k{font-size:12px;color:var(--ink2)}
.kpis .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpis .s{font-size:12px;color:var(--ink2)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 0}
.bar>i{display:block;height:100%}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.up{color:var(--up)} .dn{color:var(--down)}
.sortbtn{all:unset;cursor:pointer;display:inline-block;padding:6px 2px;margin:-6px 0;color:inherit;font:inherit;white-space:nowrap;border-radius:4px;transition:color .15s ease,background-color .15s ease}
.sortbtn:hover{color:var(--ink)}.sortbtn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
th.sortable.on .sortbtn{color:var(--brand);font-weight:700}
.sortbtn .hint{color:#b5b2aa}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;line-height:20px;border:1px solid currentColor}
.g{color:var(--ok)} .y{color:var(--warn)} .r{color:var(--bad)} .n{color:var(--ink2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.g{background:var(--ok)} .dot.y{background:#d99a00} .dot.r{background:var(--bad)} .dot.n{background:#b9b6ae}
.lights{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
/* 금리 한눈에 */
.rates{display:grid;grid-template-columns:1fr 1fr 2fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.rates>div{background:var(--surface);padding:12px 14px}
.rates .k{font-size:12px;color:var(--ink2)} .rates .v{font-size:24px;font-weight:700;line-height:1.25} .rates .s{font-size:12.5px;color:var(--ink2)}
.grade{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:8px 0 4px;position:relative}
.grade span{height:10px;display:block}
.grade span:nth-child(1){background:#2e8b57;border-radius:99px 0 0 99px}.grade span:nth-child(2){background:#8cbf5a}.grade span:nth-child(3){background:#e0b028}.grade span:nth-child(4){background:#e07a28}.grade span:nth-child(5){background:#b42318;border-radius:0 99px 99px 0}
.grade i{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.gradelbl{display:grid;grid-template-columns:repeat(5,1fr);font-size:11.5px;color:var(--ink2);text-align:center}
.gradelbl b{color:var(--ink)}
/* 매수 후보 하이라이트 */
tr.buy2 td{background:#e6f2eb} tr.buy2 td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
tr.buy1 td{background:#f3f8f4} tr.buy1 td:first-child{box-shadow:inset 4px 0 0 #8cbf5a}
tr.hot td{background:#fdf1ef} tr.hot td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
/* 시세 목록: 휴대폰에서도 표 그대로 가로 스크롤, 종목 열 고정 (11-14 Ben) */
.mtbl td:first-child,.mtbl th:first-child{position:sticky;left:0;z-index:1}
.mtbl tr:not(.buy2):not(.buy1):not(.hot) td:first-child,.mtbl th:first-child{background:var(--surface)}
.mtbl td:first-child{box-shadow:inset -1px 0 0 var(--line)}
@media(max-width:640px){ .mtbl{min-width:720px} .mtbl td:first-child{min-width:0;width:124px;max-width:124px;white-space:normal;line-height:1.3} .mtbl .symbtn .muted{display:block;font-size:12px} .mtbl .sig{display:table;margin:3px 0 0} }
.sig{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.sig.s2{background:var(--ok);color:#fff} .sig.s1{background:#dcebdf;color:#1d5c3a} .sig.sh{background:#f6d5d0;color:#8a1c12}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cands button{all:unset;cursor:pointer;font-size:13.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s ease,background-color .15s ease}
.cands button:hover{border-color:var(--brand)} .cands button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cands button.s2{border-color:var(--ok);background:#e6f2eb} .cands button.s1{border-color:#8cbf5a}
.symbtn{all:unset;cursor:pointer;border-radius:4px;transition:color .15s ease}
.symbtn:hover b{color:var(--brand);text-decoration:underline;text-underline-offset:3px} .symbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
td.l .symbtn{display:block}
/* 차트 팝업 */
dialog.chartdlg{border:0;border-radius:14px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--ink)}
dialog.chartdlg::backdrop{background:rgba(20,22,20,.45)}
dialog.chartdlg.fb{position:fixed;inset:4vh 3vw auto;margin:0 auto;z-index:50;overflow:auto;background:var(--surface)}
.mtbl tr[data-chart]{cursor:pointer}
#dlgclose{white-space:nowrap;flex:0 0 auto}
.dlghead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.dlghead h3{margin:0;font-size:17px} .dlghead .muted{margin-top:2px}
.dlgbody{padding:0 16px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 8px}
.seg button{background:transparent;color:var(--ink2);border:0;border-radius:0;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg button:hover{background:var(--brand-soft)} .seg button[aria-pressed="true"]:hover{background:var(--brand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:3px;margin-right:4px}
.pchart{width:100%;display:block;touch-action:none}
.tip{font-size:12.5px;color:var(--ink2);min-height:18px}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;font-size:13px}
.dstats div{background:#f7f6f2;border-radius:8px;padding:7px 9px} .dstats b{display:block;font-size:15px}
@media (max-width:860px){.rates{grid-template-columns:1fr 1fr}.rates>div:last-child{grid-column:1/-1}.dstats{grid-template-columns:1fr 1fr}}
.light{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.light .t{font-size:13px;color:var(--ink2)}
.light .st{font-size:17px;font-weight:700;margin:2px 0 4px}
.light .d{font-size:12.5px;color:var(--ink2)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:10px 0 10px 36px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li.done::before{background:var(--ok);content:"✓"}
.steps li.now{background:var(--accent-soft);margin:0 -16px;padding-left:52px;padding-right:16px}
.steps li.now::before{left:16px;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:500}
.bar{height:8px;background:#ebe9e3;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--accent)}
button,.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;transition:background-color .15s ease,transform .1s ease}
button:hover{background:#0b2f30}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #f4b37a;outline-offset:2px}
button.ghost{background:transparent;color:var(--brand)}
button.ghost:hover{background:var(--brand-soft)}
textarea,input{font:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;transition:border-color .15s ease}
textarea:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
svg.spark{display:block}
.tag{font-size:11.5px;color:var(--ink2);background:#efede7;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px}
.big{font-size:22px;font-weight:700}
.chart{width:100%;height:220px}
footer{color:var(--ink2);font-size:12px;margin-top:28px;line-height:1.7}
.hide{display:none}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kvrow label{flex:1;font-size:14px}
.inline{display:flex;align-items:center;gap:6px;white-space:nowrap}
.inline input{width:84px;text-align:right}
.inline output{min-width:64px;text-align:right;font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:12px}
.check input{width:auto;margin-top:4px}
button:disabled{opacity:.45;cursor:not-allowed}
input.ro{background:#f3f2ee;color:var(--ink2)}
@media (max-width:860px){
  .hero{grid-template-columns:repeat(3,1fr)}
  .hero .state{grid-column:1/-1}
  .hero>div:last-child{grid-column:span 2}
  .grid2{grid-template-columns:1fr}
  .lights{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  body{font-size:14.5px}
  .wrap{padding:0 12px 56px}
  .hero .v{font-size:18px}
  th,td{padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Stock Dashboard</h1>
      <div class="meta" id="meta">불러오는 중…</div>
    </div>
    <div class="hero" id="hero" aria-live="polite"></div>
    <div class="stages" id="stages"></div>
  </div>
</header>
<nav aria-label="화면 이동"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="app"><p class="muted">데이터를 불러오는 중입니다.</p></main>

<script>
"use strict";
/* ============================================================
   규칙 상수 (Band 전략 종합 분석 + Ben 결정 2026-11-07)
   ============================================================ */
const RULES = {

function spark(arr, w=96, h=26){
  if(!arr || arr.length<2) return "";
  const a = arr.filter(x=>x!=null), mn=Math.min(...a), mx=Math.max(...a), rg=(mx-mn)||1;
  const pts = a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/rg*(h-4)).toFixed(1)}`).join(" ");
  const c = a[a.length-1]>=a[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.5" points="${pts}"/></svg>`;
}

async function getJSON(p){ const r = await fetch(p+"?t="+Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptHoldings(enc){
  let pk = null; try{ pk = localStorage.getItem("holdings_key"); }catch(e){}
  if(!pk) return null;
  const key = await crypto.subtle.importKey("pkcs8", b64d(pk.replace(/-----[^-]+-----|\s/g,"")), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
  const raw = await crypto.subtle.decrypt({name:"RSA-OAEP"}, key, b64d(enc.ek));
  const aes = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, aes, b64d(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(){
  const E = window.__EMBED__;
  if(E) return {market:E.market, bt:E.backtest||null, study:E.study||null, H:applyCfg(E.holdings), enc:false, locked:false, owner:true};
  const market = await getJSON("data/market.json");
  const bt = await getJSON("data/backtest.json").catch(()=>null);
  const study = await getJSON("data/overheat_study.json").catch(()=>null);
  let H=null, enc=false, locked=false;
  try{
    const e = await getJSON("data/holdings.enc.json"); enc = true;
    H = await decryptHoldings(e).catch(()=>null);
    if(!H) locked = true;
  }catch(err){
    H = await getJSON("data/holdings.json").catch(()=>null);
  }
  const owner = !!H;
  H = applyCfg(H || skeletonHoldings());
  return {market, bt, study, H, enc, locked, owner};
}

function macroLights(m){
  const out = [];
  // 금리
  {
    const f = m.fedu, d2 = m.dgs2?.v;
    let c="n", st="데이터 대기", d="기준금리 상단(DFEDTARU)·2년물(DGS2)";
    if(f?.v!=null){
      const six = new Date(); six.setMonth(six.getMonth()-6);
      const recent = (f.changes||[]).filter(x=>new Date(x.date)>=six);
      const hikes = recent.filter(x=>x.delta>0).length, cuts = recent.filter(x=>x.delta<0).length;
      const emerg = recent.some(x=>x.delta<=-0.5);
      const emp = empLight(m);
      if(emerg){ c="r"; st="긴급 인하"; }
      else if(hikes){ c="y"; st="인상기"; }
      else if(cuts){ c = emp.c==="r" ? "r" : "g"; st = emp.c==="r" ? "침체형 인하" : "인하기"; }
      else { const lastUp = (f.changes||[]).slice(-1)[0]?.delta>0; c = lastUp && d2!=null && d2<f.v ? "y" : "g"; st = lastUp && d2<f.v ? "고점 동결" : "동결"; }
      d = `기준금리 ${num(f.v,2)}% · 2년물 ${num(d2,2)}% (시장 기대 ${d2!=null? (d2<f.v?"인하":"동결·인상"):"–"})`;
    }
    out.push({t:"금리 사이클", c, st, d});
  }
  // 장기금리 (11-13 Ben): 미 10년물. 표시는 5%↑ 경고(빨강). 모드 판정은 5.0~5.5% 노랑, 5.5%↑ 빨강 (1990년대엔 5~7%에서도 강세장이라 5%만으로 수비 전환은 과함)
  {
    const t = m.dgs10?.v, g = rateGrade(t), f = m.fedu?.v;
    out.push({t:"장기금리 (미 10년물)", c:g.c, st:g.st, d: t!=null? `10년물 ${num(t,2)}% · 기준금리 상단 ${num(f,2)}% · 차이 ${f!=null? (t-f>=0?"+":"")+num(t-f,2)+"%p":"–"}` : "10년물(DGS10) 데이터 대기 — 다음 갱신부터 표시", mode: t==null? "n" : t>=5.5? "r" : t>=5.0? "y" : "g"});
  }
  { const e = empLight(m); out.push({t:"고용", ...e}); }
  // 유동성
  {
    const nl = m.netliq, so = m.sofr?.v, io = m.iorb?.v;
    let c="n", st="데이터 대기", d="연준 자산 − TGA − 역레포";
    if(nl?.v!=null){
      const stress = so!=null && io!=null && so>io;
      if(nl.weeks_down>=13 || stress){ c="r"; st= stress? "자금시장 경색":"13주 연속 감소"; }
      else if(nl.chg4w<0){ c="y"; st="4주 감소"; }
      else { c="g"; st="증가"; }
      d = `순유동성 ${num(nl.v/1000,2)}조$ · 4주 ${nl.chg4w>0?"+":""}${num(nl.chg4w,0)}억$… `.replace("억$… ","0억$") ;
      d = `순유동성 ${num(nl.v/1000,2)}조$ · 4주 변화 ${nl.chg4w>0?"+":""}${num(nl.chg4w,0)}B$ · SOFR−IORB ${so!=null&&io!=null? num((so-io)*100,0)+"bp":"–"}`;
    }
    out.push({t:"유동성", c, st, d});
  }
  // 신용
  {
    const hy = m.hy?.v, ts = m.t10y2y?.v;
    let c="n", st="데이터 대기", d="하이일드 스프레드(BAMLH0A0HYM2)";
    if(hy!=null){
      c = hy>=5 ? "r" : hy>=4 ? "y" : "g";
      st = hy>=6 ? "위기 (≥6%)" : hy>=5 ? "경계" : hy>=4 ? "주의" : "안정";
      d = `HY ${num(hy,2)}%${m.hy.chg4w!=null? " (4주 "+(m.hy.chg4w>0?"+":"")+num(m.hy.chg4w,2)+"%p)":""} · 10Y-2Y ${num(ts,2)}%p`;
    }
    out.push({t:"신용", c, st, d});
  }
  return out;
}

function valueAccounts(H, S, fx){

/* 연금·IRP 나스닥100 (Ben 2026-11-08): 평상시 TIGER 지수형, QQQ 5년 고점 −20% 이하 폭락장에서는 고베타 TIME 액티브(레버리지 대용, 매도 없음) */
function nasdaqPick(E){ return (E.dd!=null && E.dd<=-20) ? "426030" : "133690"; }
/* ---------- IRP ---------- */
function planIRP(E){
  const a = E.acc.list.find(x=>x.id==="irp"); if(!a) return null;
  const [lo,hi] = RULES.irpTarget[E.state]||[55,60];
  const max = E.H.settings.irp_risk_max_pct||70;
  const cur = a.riskPct;
  const gapLo = (lo-cur)/100*a.val, gapHi = (Math.min(hi,max)-cur)/100*a.val;
  const ks = E.S["^KS11"]||{};
  const ksDD = ks.dd_ath ?? ks.dd52;
  const kodexOn = (ksDD!=null && ksDD<=-10) || (ks.rsi!=null && ks.rsi<=30);
  const sleeve = a.val*0.20, tick = sleeve*0.10*(ks.rsi!=null && ks.rsi<=25 ? 2 : 1);
  // 위험자산 구성(Ben 2026-11-08): S&P500 40 · 나스닥100 30 · 미국배당다우존스 30. 부족분은 이 비율로, 모자란 종목부터.
  const NQ = nasdaqPick(E); const MIX = {"360750":40, [NQ]:30, "458730":30};   // 나스닥100: 신규는 TIGER 지수형(11-08), 기존 TIME 액티브 보유분도 같은 칸으로 계산
  const riskPos = (a.pos||[]).filter(p=>p.risk); const riskV = riskPos.reduce((x,p)=>x+p.v,0);
  const after = riskV + Math.max(0,gapLo);
  const buys = Object.entries(MIX).map(([t,w])=>{ const have=riskPos.filter(p=>p.t===t || (t===NQ && (p.t==="426030"||p.t==="133690"))).reduce((x,p)=>x+p.v,0); return {t, w, name:KR_NAMES[t], have, need: Math.max(0, after*w/100 - have)}; });
  const needSum = buys.reduce((x,b)=>x+b.need,0); if(needSum>0 && gapLo>0) buys.forEach(b=>b.buy = gapLo*b.need/needSum); else buys.forEach(b=>b.buy=0);
  return {a, lo, hi, max, cur, gapLo, gapHi, ks, ksDD, kodexOn, sleeve, tick, todayBuy: kodexOn && ks.chg!=null && ks.chg<=-1.5, MIX, buys};
}

/* ---------- 연금저축 ---------- */
function planPension(E){
  const amt = (E.H?.settings?.monthly_pension_krw||450000);
  // Ben 2026-11-08: 연금저축 = 배당(미국배당다우존스) 60 + 나스닥100 40. 나스닥 쏠림 분산 + 배당 과세이연.
  // QQQ 고점 대비 -10% 이하면 싸진 나스닥100을 50:50까지 더 삼(싸게 사기). 매도 없음.
  const tilt = E.stage>=1;
  const NQ = nasdaqPick(E);
  let rows = tilt ? [{t:"458730",w:50},{t:NQ,w:50}] : [{t:"458730",w:60},{t:NQ,w:40}];   // 11-08: TIME 액티브 → TIGER 나스닥100 지수형(변동성 1.8배 문제)
  const by = E.H?.settings?.birth_year, sa = E.H?.settings?.pension_start_age||55;
  const glide = by? {age:new Date().getFullYear()-by, sa} : null;
  let rs = rows.map(r=>({...r, px:priceOf(r.t,E.S)}));
  // 1주 미만인 몫은 이번 달 예수금으로 두고 다음 달 같은 몫과 합쳐 매수(비중 유지)
  const short = rs.filter(r=>r.px && amt*r.w/100 < r.px).map(r=>KR_NAMES[r.t]);
  const merged = short.length? short : null;
  return {amt, tilt, merged, glide, rows: rs.map(r=>{ const won_=amt*r.w/100; return {...r, name:KR_NAMES[r.t], won:won_, sh: r.px? Math.floor(won_/r.px): null}; })};
}

/* ---------- 매수 창 ---------- */
function buyWindow(day=25){
  const now = new Date();
  const kst = new Date(now.getTime() + (now.getTimezoneOffset()+540)*60000);
  let y=kst.getFullYear(), m=kst.getMonth();
  const mk = (y,m)=>{ let d=new Date(y,m,day); const s=new Date(d); while(s.getDay()===0||s.getDay()===6) s.setDate(s.getDate()+1); const e=new Date(s); let n=0; while(n<3){ e.setDate(e.getDate()+1); if(e.getDay()!==0&&e.getDay()!==6) n++; } return {s,e}; };
  let w = mk(y,m);
  const today = new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  if(today > w.e) w = mk(m===11?y+1:y, (m+1)%12);
  const dd = Math.round((w.s - today)/864e5);
  const f = d=>`${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`;
  return {start:w.s, end:w.e, dday: dd, label:`${f(w.s)} ~ ${f(w.e)}`, inWindow: today>=w.s && today<=w.e};
}

function jpSig(s){
  const d=s.dd52, aux=[s.rsi!=null&&s.rsi<=30 && `RSI ${num(s.rsi,0)}`, s.vs200!=null&&s.vs200<=-10 && `200일선 ${pct(s.vs200,0)}`, (s.bb_break||(s.bb_pctb!=null&&s.bb_pctb<=5)) && "볼린저 하단"].filter(Boolean);
  const tr = d!=null && JP_TIERS.find(x=>d<=x[0]);
  const why = [`MDD ${pct(d,0)}`, ...aux].join(" · ");
  if(tr && (aux.length>=2 || d<=-35)) return {lv:2, label:"엔화 매수", why:`${why} → ${tr[1]}`};
  if(d!=null && d<=-10 && aux.length>=1) return {lv:1, label:"관찰", why:`${why} · MDD −15%↑ + 보조 2개면 매수`};
  return null;
}
function buySig(t, s){
  if(!s) return null;
  if(t==="1489.T") return jpSig(s);
  const hot = s.rsi!=null && s.rsi>=70 && s.vs200!=null && s.vs200>=10;
  if(s.group==="빅테크" && t!=="MAGS"){
    const d=s.dd52, r=s.rsi;
    if(d!=null && r!=null && d<=-30 && r<=30) return {lv:2, label:"드문 매수 기회", why:`1년 고점 ${pct(d,0)} · RSI ${num(r,0)}`};
    if(d!=null && r!=null && d<=-20 && r<=40) return {lv:1, label:"관찰", why:`1년 고점 ${pct(d,0)} · RSI ${num(r,0)}`};
    return hot? {lv:-1, label:"과열·보류", why:`RSI ${num(s.rsi,0)} · 200일선 ${pct(s.vs200,0)}`} : null;
  }
  if(s.group==="성장주"){   // 모니터링: −70% + RSI ≤ 30이면 스윙 후보, −60% + RSI ≤ 40이면 관찰
    const d=s.dd52, r=s.rsi;
    if(d!=null && r!=null && d<=-70 && r<=30) return {lv:2, label:"폭락 스윙 후보", why:`1년 고점 ${pct(d,0)} · RSI ${num(r,0)}`};
    if(d!=null && r!=null && d<=-60 && r<=40) return {lv:1, label:"관찰", why:`1년 고점 ${pct(d,0)} · RSI ${num(r,0)}`};
    return null;
  }
  if(!BUY_ETF.includes(t) && !(t==="MAGS")) return null;
  const hits = [];
  if(s.rsi!=null && s.rsi<=35) hits.push(`RSI ${num(s.rsi,0)}`);
  if(s.vs200!=null && s.vs200<=0) hits.push("200일선 아래");
  if(s.bb_break || (s.bb_pctb!=null && s.bb_pctb<=5)) hits.push("볼린저 하단");
  if(s.dd52!=null && s.dd52<=-10) hits.push(`1년 고점 ${pct(s.dd52,0)}`);
  if(hits.length>=3) return {lv:2, label:"매수 적기", why:hits.join(" · ")};
  if(hits.length===2) return {lv:1, label:"분할 매수 고려", why:hits.join(" · ")};
  if(hot) return {lv:-1, label:"과열·보류", why:`RSI ${num(s.rsi,0)} · 200일선 ${pct(s.vs200,0)}`};
  return null;
}

function lineChart(arr, th=[], h=140){

  return `<svg viewBox="0 0 ${W} ${h}" class="chart" style="height:${h}px" preserveAspectRatio="none" role="img" aria-label="추이 차트">

  const modeTxt = {공격:"레버리지 정상", 중립:"레버리지 절반만", 수비:"레버리지 멈춤"}[E.mode.name] || "";
  const tiles = [

function bindPlan(){
  const keys=["longterm","ammo","pension","swing"], free=["ammo","pension","swing"];
  const read=()=>{ const t=Math.max(0,Math.round(+$("#c_total").value||0))*1e4;
    const P={}; free.forEach(k=>{ let v=Math.round((+$("#p_"+k).value||0)*10)/10; P[k]=Math.min(100,Math.max(0,v)); });
    P.longterm = Math.round((100-P.ammo-P.pension-P.swing)*10)/10; return {t,P}; };
  const cur=()=>{ const {t,P}=read(); return {total:t, pct:P, fractional:$("#c_frac").checked, gold_extra:$("#c_gold").checked}; };
  const upd=(save=true)=>{ const {t,P}=read(); const bad = P.longterm<0 || t<=0;
    $("#p_longterm").value = Math.max(0,P.longterm);
    keys.forEach(k=>{ $("#o_"+k).textContent = won(t*Math.max(0,P[k])/100); });
    $("#c_sum").innerHTML = P.longterm<0 ? `<span class="r">현금·연금저축·스윙 합이 ${100-P.longterm}%입니다. 100% 이하로 줄여 주세요</span>` : `합계 100% = ${won(t)}`;
    $("#c_line").innerHTML = bad? "" : `장투 ${P.longterm}% · 현금 ${P.ammo}% · 연금저축 ${P.pension}%${P.swing? " · 스윙 "+P.swing+"%":""} · 금현물 1g은 ${$("#c_gold").checked? "저축 밖에서 추가":"장투 몫에서"} (<a href="#c_more" id="c_open">바꾸기</a>). 종목·비중은 규칙이 정합니다.`;
    const op=$("#c_open"); if(op) op.onclick=e=>{ e.preventDefault(); $("#c_more").open=true; $("#c_more").scrollIntoView({behavior:"smooth"}); };
    $("#c_pen").innerHTML = pensionCheckHTML(pensionCheck(t*Math.max(0,P.pension)/100, (+$("#c_irp").value||0)*1e4));
    if(bad) return;
    const s=E.H.settings; const r3 = v=>Math.round(v/1e3)*1e3;
    Object.assign(s,{monthly_ammo_krw:r3(t*P.ammo/100), monthly_pension_krw:r3(t*P.pension/100), monthly_swing_krw:r3(t*P.swing/100)});
    Object.assign(s,{monthly_longterm_krw:t-s.monthly_ammo_krw-s.monthly_pension_krw-s.monthly_swing_krw, fractional:$("#c_frac").checked, gold_extra:$("#c_gold").checked});
    if(save) saveCfg(cur());
    try{ $("#plan_body").innerHTML = planBody(); stackTables($("#plan_body")); document.querySelectorAll("#plan_body [data-chart]").forEach(b=>b.onclick=()=>openChart(b.dataset.chart)); }
    catch(e){ $("#plan_body").innerHTML = `<p class="muted">계산 실패: ${esc(e.message)}</p>`; console.error(e); }
  };
  $("#c_total").addEventListener("input",()=>upd());
  free.forEach(k=>$("#p_"+k).addEventListener("input",()=>upd()));
  free.forEach(k=>$("#p_"+k).addEventListener("change",()=>{ $("#p_"+k).value=Math.round((+$("#p_"+k).value||0)*10)/10; upd(); }));
  $("#c_frac").addEventListener("change",()=>upd()); $("#c_gold").addEventListener("change",()=>upd());
  $("#c_irp").addEventListener("input",()=>{ try{ localStorage.setItem("irp_annual", Math.max(0,Math.round(+$("#c_irp").value||0))*1e4); }catch(e){} upd(); });
  upd(false);
  $("#c_reset").onclick=()=>{ try{ localStorage.removeItem("user_cfg"); localStorage.removeItem("quick_total"); }catch(e){} location.reload(); };
}

/* ---------- 연금계좌 세액공제 한도 (2023년~ 소득세법: 연금저축 600만, 연금저축+IRP 900만 공제 / 납입은 합산 1,800만, ISA 만기 전환분 별도) ---------- */
const PEN_LIM = {ps:6e6, all:9e6, pay:1.8e7};
function irpAnnual(){ try{ const v=localStorage.getItem("irp_annual"); if(v!=null && v!=="") return +v; }catch(e){} return E?.H?.settings?.irp_annual_krw||0; }
function pensionCheck(psMonthly, irp){
  const ps = psMonthly*12, tot = ps+irp, ded = Math.min(Math.min(ps,PEN_LIM.ps)+irp, PEN_LIM.all);
  const msgs = [];
  if(tot > PEN_LIM.pay) msgs.push({c:"bad", t:`연금저축+IRP 연 납입 ${won(tot)}이 납입 한도 1,800만을 ${won(tot-PEN_LIM.pay)} 넘습니다. 초과분은 넣을 수 없습니다(ISA 만기 전환분은 별도).`});
  if(ps > PEN_LIM.ps) msgs.push({c:"warn", t:`연금저축 ${won(ps)} 중 600만 초과분 ${won(ps-PEN_LIM.ps)}은 연금저축 한도라 공제가 안 됩니다. IRP로 넣으면 합산 900만까지 공제됩니다.`});
  if(tot > PEN_LIM.all && tot <= PEN_LIM.pay) msgs.push({c:"warn", t:`합산 ${won(tot)}으로 공제 한도 900만을 ${won(tot-PEN_LIM.all)} 넘습니다. 초과분은 공제 없이 과세이연만 됩니다. 1,800만까지 더 넣을 수 있고, 두 번째 연금저축 계좌에 따로 넣으면 공제 안 받은 원금을 나중에 세금 없이 꺼내기 쉽습니다.`});
  if(tot < PEN_LIM.all) msgs.push({c:"info", t:`공제 한도 900만까지 ${won(PEN_LIM.all-tot)} 남았습니다${ps<PEN_LIM.ps? ` (연금저축은 600만까지 ${won(PEN_LIM.ps-ps)})`:""}.`});
  return {ps, irp, tot, ded, refund:[ded*0.132, ded*0.165], msgs};
}
function pensionCheckHTML(pc, compact){
  const head = `연금저축 ${won(pc.ps)} + IRP ${won(pc.irp)} = 연 ${won(pc.tot)} · 공제 대상 ${won(pc.ded)} · 환급 약 ${won(pc.refund[0])}(총급여 5,500만 이하면 ${won(pc.refund[1])})`;
  const show = compact ? pc.msgs.filter(m=>m.c!=="info") : pc.msgs;
  return `<div class="panel" style="margin-top:10px"><p style="margin:0"><b>연금 세액공제</b> <span class="muted">${head}</span></p>${show.map(m=>`<div class="alert ${m.c==="info"?"info":m.c==="bad"?"bad":""}" style="margin-top:8px">${esc(m.t)}</div>`).join("")}</div>`;
}

/* 휴대폰 표 → 행 카드: 머리글을 각 칸 data-label로 복사 (.qtbl은 3열이라 제외) */
function stackTables(root){
  (root||document).querySelectorAll(".tbl table:not(.qtbl):not(.mtbl):not(.stack)").forEach(t=>{
    const rows=[...t.rows]; if(!rows.length) return;
    const hr=rows[0]; if(![...hr.cells].some(c=>c.tagName==="TH")) return;
    hr.classList.add("hd");
    const heads=[]; [...hr.cells].forEach(c=>{ for(let n=0;n<(c.colSpan||1);n++) heads.push(c.textContent.replace(/[↕▲▼]/g,"").trim()); });
    rows.slice(1).forEach(r=>{ let col=0; [...r.cells].forEach((c,ix)=>{ const span=c.colSpan||1;
      if(span===1 && ix>0 && heads[col] && c.tagName==="TD") c.dataset.label=heads[col];
      if(span>1 || (c.classList.contains("l") && ix>0 && (c.textContent||"").length>40)) c.classList.add("wide");
      col+=span; }); });
    t.classList.add("stack");
  });
}
function render(){
  const home = "plan";   // 첫 화면: 이번 달 매수(적립 계산기 통합, 11-14 Ben)
  const h = (location.hash||"#"+home).slice(1);
  const view = VIEWS.find(v=>v[0]===h) ? h : home;
  if(view!==h && location.hash) history.replaceState(null,"",location.pathname+location.search+"#"+view);   // 없어진 탭 주소(#settings 등) 정리
  $("#nav").innerHTML = VIEWS.map(([k,t],i)=>`<a href="#${k}"${i<2?` class="key${i===1?" key-last":""}"`:""} ${k===view?'aria-current="page"':""}>${t}</a>`).join("");
  const fn = {today:vToday, plan:vPlan, crash:vCrash, scenario:vScenario, heat:vHeat, people:vPeople, accounts:vAccounts, market:vMarket, macro:vMacro, backtest:vBacktest, rules:vRules}[view];
  try{ $("#app").innerHTML = fn() + footer(); }catch(err){ $("#app").innerHTML = `<div class="alert bad">화면 계산 오류: ${esc(err.message)}</div>`; console.error(err); }
  stackTables($("#app"));
  if(view==="plan") bindPlan();
  if(view==="market") bindMarket();
  document.querySelectorAll("[data-chart]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openChart(b.dataset.chart); });   // 시세 표는 줄 전체를 눌러도 열림
  if(view==="rules"){
    $("#pkfile").onchange=async e=>{ const f=e.target.files[0]; if(f){ $("#pk").value=(await f.text()).trim(); } };
    $("#pksave").onclick=()=>{ try{ localStorage.setItem("holdings_key", $("#pk").value.trim()); location.reload(); }catch(e){} };
    $("#pkclear").onclick=()=>{ try{ localStorage.removeItem("holdings_key"); location.reload(); }catch(e){} };
  }
}
function footer(){ return `<footer>투자 판단 보조 도구입니다. 규칙 수치는 Band 전략 분석 초안이며 백테스트로 조정합니다. 시세는 Yahoo Finance·네이버(15분 이상 지연), 거시지표는 FRED.</footer>`; }

(async()=>{
  try{
    if(new URLSearchParams(location.search).has("simple") || location.hash==="#quick" || location.hash==="#settings") history.replaceState(null,"",location.pathname+"#plan");   // 옛 간편 보기·적립 계산기 주소 → 이번 달 매수
    DATA = await load();
    E = engine(DATA);
    renderHero(); render();
    addEventListener("hashchange", ()=>{ render(); scrollTo({top:0}); });
  }catch(err){
    $("#app").innerHTML = `<div class="alert bad">데이터를 불러오지 못했습니다: ${esc(err.message)}</div>`;
  }
})();
</script>
