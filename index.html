<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d3e">
<title>적립 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#1c1c1a; --ink2:#55534e; --line:#e3e1db;
  --brand:#0f3d3e; --brand-soft:#e3eded; --accent:#b54708; --accent-soft:#fdf0e6;
  --up:#c62828; --down:#1d4ed8; --ok:#1f7a4d; --warn:#a15c00; --bad:#b42318;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header{background:var(--brand);color:#fff}
header .wrap{padding-top:14px;padding-bottom:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.top .meta{font-size:12px;color:#c9dcdc}
.hero{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:1px;background:rgba(255,255,255,.14);margin:14px 0 0;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.hero>div{background:var(--brand);padding:12px 14px}
.hero .k{font-size:12px;color:#b8d0d0}
.hero .v{font-size:20px;font-weight:700;margin-top:2px}
.hero .s{font-size:12px;color:#d7e6e6}
.hero .state .v{font-size:24px}
nav{position:sticky;top:0;z-index:5;background:var(--brand);border-top:1px solid rgba(255,255,255,.14)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav .wrap::-webkit-scrollbar{display:none}
nav a{color:#cfe0e0;text-decoration:none;padding:12px 12px 10px;font-size:14px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s ease,border-color .15s ease}
nav a:hover{color:#fff}
nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
nav a[aria-current="page"]{color:#fff;border-bottom-color:#f4b37a}
main{padding-top:18px}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.2px}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--ink2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.lead{font-size:16px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.alert{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:6px;font-size:14px}
.alert.bad{border-color:var(--bad);background:#fdecea}
.alert.info{border-color:var(--brand);background:var(--brand-soft)}
.alert b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:500;background:#faf9f6;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table tr:last-child td{border-bottom:0}
.tbl td.l:first-child{min-width:150px}
tr.total td{font-weight:700;background:#faf9f6}
.up{color:var(--up)} .dn{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;line-height:20px;border:1px solid currentColor}
.g{color:var(--ok)} .y{color:var(--warn)} .r{color:var(--bad)} .n{color:var(--ink2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.g{background:var(--ok)} .dot.y{background:#d99a00} .dot.r{background:var(--bad)} .dot.n{background:#b9b6ae}
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.light{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.light .t{font-size:13px;color:var(--ink2)}
.light .st{font-size:17px;font-weight:700;margin:2px 0 4px}
.light .d{font-size:12.5px;color:var(--ink2)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:10px 0 10px 36px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li.done::before{background:var(--ok);content:"✓"}
.steps li.now{background:var(--accent-soft);margin:0 -16px;padding-left:52px;padding-right:16px}
.steps li.now::before{left:16px;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:500}
.bar{height:8px;background:#ebe9e3;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--accent)}
button,.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;transition:background-color .15s ease,transform .1s ease}
button:hover{background:#0b2f30}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #f4b37a;outline-offset:2px}
button.ghost{background:transparent;color:var(--brand)}
button.ghost:hover{background:var(--brand-soft)}
textarea,input{font:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;transition:border-color .15s ease}
textarea:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
svg.spark{display:block}
.tag{font-size:11.5px;color:var(--ink2);background:#efede7;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px}
.big{font-size:22px;font-weight:700}
.chart{width:100%;height:220px}
footer{color:var(--ink2);font-size:12px;margin-top:28px;line-height:1.7}
.hide{display:none}
@media (max-width:860px){
  .hero{grid-template-columns:repeat(3,1fr)}
  .hero .state{grid-column:1/-1}
  .hero>div:last-child{grid-column:span 2}
  .grid2{grid-template-columns:1fr}
  .lights{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  body{font-size:14.5px}
  .wrap{padding:0 12px 56px}
  .hero .v{font-size:18px}
  th,td{padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>적립 대시보드</h1>
      <div class="meta" id="meta">불러오는 중…</div>
    </div>
    <div class="hero" id="hero" aria-live="polite"></div>
  </div>
</header>
<nav aria-label="화면 이동"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="app"><p class="muted">데이터를 불러오는 중입니다.</p></main>

<script>
"use strict";
/* ============================================================
   규칙 상수 (Band 전략 종합 분석 + Ben 결정 2026-11-07)
   ============================================================ */
const RULES = {
  // 장투 월 200만 배분 (만원) — QQQ 고점 대비 낙폭 단계별
  monthly: [
    {min:-10,  label:"평상",      alloc:{QQQM:80, SPYM:60, QLD:40}},
    {min:-15,  label:"조정 -10%", alloc:{QQQM:90, SPYM:60, QLD:50}},
    {min:-20,  label:"하락 -15%", alloc:{QQQM:90, SPYM:50, QLD:60}},
    {min:-30,  label:"하락 -20%", alloc:{QQQM:60, SPYM:20, QLD:120}},
    {min:-999, label:"폭락 -30%", alloc:{QQQM:40, SPYM:0, QLD:120, TQQQ:40}},
  ],
  // 현금 4차: pct=모은 돈(사이클 시작 기준) 대비, rem=집행 시점 남은 잔액 대비 (15/20/25/40 → 15/23.5/38.5/100)
  tranches: [
    // 현금 계좌(Ben 2026-11-08): QQQ 고점 대비 -30/-40/-60/-80%에서만. 선집행 없음
    {n:1, dd:-30, pct:15, rem:15,   mix:{QQQM:70, QLD:30}},
    {n:2, dd:-40, pct:20, rem:23.5, mix:{QQQM:60, QLD:40}},
    {n:3, dd:-60, pct:25, rem:38.5, mix:{QLD:80, QQQM:20}},
    {n:4, dd:-80, pct:40, rem:100,  mix:{QLD:80, TQQQ:20}},
  ],
  states: {
    1:{name:"상승", desc:"가격 > 50일선 > 200일선, 고점 대비 -10% 이내"},
    2:{name:"조정", desc:"200일선 위지만 50일선 아래, 또는 고점 대비 -10~-15%"},
    3:{name:"추세 이탈", desc:"200일선 -3% 아래로 2일 연속 마감"},
    4:{name:"폭락", desc:"추세 이탈 + 고점 대비 -25% 이상 + (공포탐욕 ≤20 또는 VIX ≥35)"},
    5:{name:"회복", desc:"추세 이탈 후 200일선 +3% 위로 2일 연속 마감"},
  },
  irpTarget: {1:[55,60], 2:[58,62], 3:[62,65], 4:[68,70], 5:[55,60]},
  fngLink: "https://naver.me/xZKtAlYM",
};
const KR_NAMES = {"0048J0":"KODEX 미국머니마켓액티브","360750":"TIGER 미국S&P500","426030":"TIME 미국나스닥100액티브","0046A0":"TIGER 미국초단기국채","0137W0":"KIWOOM 미국S&P500&GOLD","069500":"KODEX 200","458730":"TIGER 미국배당다우존스"};

/* ============================================================
   유틸
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d=0) => v==null||isNaN(v) ? "–" : Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const won = v => v==null||isNaN(v) ? "–" : (Math.abs(v)>=1e8 ? num(v/1e8,2)+"억" : Math.abs(v)>=1e4 ? num(v/1e4,0)+"만" : num(v,0)) + "원";
const usd = (v,d=2) => v==null||isNaN(v) ? "–" : "$"+num(v,d);
const pct = (v, d=1, sign=true) => v==null||isNaN(v) ? "–" : (sign && v>0 ? "+" : "") + num(v,d) + "%";
const cls = v => v==null ? "" : v>0 ? "up" : v<0 ? "dn" : "";
const cpct = (v,d=1) => `<span class="${cls(v)}">${pct(v,d)}</span>`;
const pill = (txt, c) => `<span class="pill ${c}">${esc(txt)}</span>`;
function spark(arr, w=96, h=26){
  if(!arr || arr.length<2) return "";
  const a = arr.filter(x=>x!=null), mn=Math.min(...a), mx=Math.max(...a), rg=(mx-mn)||1;
  const pts = a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/rg*(h-4)).toFixed(1)}`).join(" ");
  const c = a[a.length-1]>=a[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.5" points="${pts}"/></svg>`;
}

/* ============================================================
   데이터 로드 (임베드 → 파일)
   ============================================================ */
async function getJSON(p){ const r = await fetch(p+"?t="+Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptHoldings(enc){
  let pk = null; try{ pk = localStorage.getItem("holdings_key"); }catch(e){}
  if(!pk) return null;
  const key = await crypto.subtle.importKey("pkcs8", b64d(pk.replace(/-----[^-]+-----|\s/g,"")), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
  const raw = await crypto.subtle.decrypt({name:"RSA-OAEP"}, key, b64d(enc.ek));
  const aes = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, aes, b64d(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(){
  const E = window.__EMBED__;
  if(E) return {market:E.market, bt:E.backtest||null, study:E.study||null, H:E.holdings, enc:false, locked:false};
  const market = await getJSON("data/market.json");
  const bt = await getJSON("data/backtest.json").catch(()=>null);
  const study = await getJSON("data/overheat_study.json").catch(()=>null);
  let H=null, enc=false, locked=false;
  try{
    const e = await getJSON("data/holdings.enc.json"); enc = true;
    H = await decryptHoldings(e).catch(()=>null);
    if(!H) locked = true;
  }catch(err){
    H = await getJSON("data/holdings.json").catch(()=>null);
  }
  return {market, bt, study, H, enc, locked};
}

/* ============================================================
   엔진: 시장 상태, 신호등, 추천
   ============================================================ */
function engine(D){
  const M = D.market, S = M.symbols, H = D.H;
  const fx = M.fx.usdkrw || S["KRW=X"]?.price || 1350;
  const q = S.QQQ || {};
  const vix = S["^VIX"]?.price ?? M.macro?.vix?.v;
  const fng = M.fng?.score ?? null;
  const dd = q.dd_ath ?? q.dd52;
  let state = q.state || 2;
  if(state===3 && dd<=-25 && fng!=null && fng<=20) state = 4;   // 공포탐욕으로 폭락 승격
  const stage = dd<=-30?4: dd<=-20?3: dd<=-15?2: dd<=-10?1: 0;

  // 보조지표 4중 2
  const aux = [
    {k:"QQQ RSI ≤ 40", ok: q.rsi!=null && q.rsi<=40, v: q.rsi!=null? num(q.rsi,1):"–"},
    {k:"VIX ≥ 20", ok: vix!=null && vix>=20, v: vix!=null? num(vix,1):"–"},
    {k:"공포탐욕 ≤ 45", ok: fng!=null && fng<=45, v: fng!=null? num(fng,0):"자산제곱 확인"},
    {k:"60/120/200일선 터치", ok: !!(q.touch && (q.touch.ma60||q.touch.ma120||q.touch.ma200)), v: q.touch? ["ma60","ma120","ma200"].filter(k=>q.touch[k]).map(k=>k.slice(2)+"일").join("·")||"없음":"–"},
  ];
  const auxN = aux.filter(a=>a.ok).length;

  // 거시 신호등
  const mac = M.macro || {};
  const L = macroLights(mac);
  const reds = L.filter(l=>l.c==="r").length, yel = L.filter(l=>l.c==="y").length, known = L.filter(l=>l.c!=="n").length;
  const mode = known===0 ? {name:"판정 대기", c:"n"} : reds>=2 ? {name:"수비", c:"r"} : (reds===1||yel>=2) ? {name:"중립", c:"y"} : {name:"공격", c:"g"};
  const hy = mac.hy?.v;
  const noLev = mode.name==="수비" || (hy!=null && hy>=6);

  // 계좌 평가
  const acc = valueAccounts(H, S, fx);

  // 경보
  const alerts = [];
  const ix = S["^IXIC"];
  if(ix?.chg!=null && ix.chg<=-3) alerts.push({c:"bad", t:`<b>나스닥 ${pct(ix.chg)}</b> — -3% 룰 발생. 장투는 매도하지 않음. 스윙 레버리지 신규 비중 절반, 현금은 보조지표 확인 후 분할.`});
  if(ix?.minus3_23d>=1) alerts.push({c: ix.minus3_23d>=4?"bad":"", t:`최근 23거래일 나스닥 -3% 하락일 <b>${ix.minus3_23d}회</b>${ix.minus3_23d>=4?" — 공황 구간(4회↑): 스윙 신규 레버리지 중단":""}${ix.minus3_dates?.length? " ("+ix.minus3_dates.join(", ")+")":""}${ix.proxy_note? " · "+esc(ix.proxy_note):""}`});
  const sx = S.SOXL;
  if(sx?.chg!=null && sx.chg<=-10) alerts.push({c:"bad", t:`<b>SOXL ${pct(sx.chg)}</b> 급락 — 스윙 단기 매수 조건(-10%) 충족. 현금의 3~5%만.`});
  if(sx?.dd52!=null && sx.dd52<=-70) alerts.push({c:"", t:`SOXL 1년 고점 대비 <b>${pct(sx.dd52,0)}</b>. 3배 반도체는 -90% 사례가 있어 1회 투입 상한을 지킬 것.`});
  if(vix!=null && vix>=30) alerts.push({c:"bad", t:`VIX <b>${num(vix,1)}</b> ≥ 30 — 공포 구간.`});
  if(hy!=null && hy>=6) alerts.push({c:"bad", t:`하이일드 스프레드 <b>${num(hy,2)}%</b> ≥ 6% — 신규 레버리지 중단 (7~8% + VIX 30~50에서 재개).`});
  const ks = S["^KS11"];
  if(ks?.chg!=null && ks.chg<=-3) alerts.push({c:"", t:`코스피 <b>${pct(ks.chg)}</b> — IRP KODEX 200 음봉 매수 규칙 확인.`});
  if(state===3||state===4) alerts.push({c:"info", t:`QQQ ${RULES.states[state].name} 상태: QLD 1층(-2% 적립)은 끄고, QLD 몫은 주 1회 4분할로 삽니다. 1배 지수는 계속 삽니다.`});
  if(acc.directTotal >= (H?.settings?.cash_trigger_krw||1e8)) alerts.push({c:"info", t:`직투 자산 1억 도달 — 스윙 계좌 현금 50% 규칙 적용.`});

  return {M,S,H,fx,q,vix,fng,dd,state,stage,aux,auxN,L,mode,noLev,hy,acc,alerts};
}

function macroLights(m){
  const out = [];
  // 금리
  {
    const f = m.fedu, d2 = m.dgs2?.v;
    let c="n", st="데이터 대기", d="기준금리 상단(DFEDTARU)·2년물(DGS2)";
    if(f?.v!=null){
      const six = new Date(); six.setMonth(six.getMonth()-6);
      const recent = (f.changes||[]).filter(x=>new Date(x.date)>=six);
      const hikes = recent.filter(x=>x.delta>0).length, cuts = recent.filter(x=>x.delta<0).length;
      const emerg = recent.some(x=>x.delta<=-0.5);
      const emp = empLight(m);
      if(emerg){ c="r"; st="긴급 인하"; }
      else if(hikes){ c="y"; st="인상기"; }
      else if(cuts){ c = emp.c==="r" ? "r" : "g"; st = emp.c==="r" ? "침체형 인하" : "인하기"; }
      else { const lastUp = (f.changes||[]).slice(-1)[0]?.delta>0; c = lastUp && d2!=null && d2<f.v ? "y" : "g"; st = lastUp && d2<f.v ? "고점 동결" : "동결"; }
      d = `기준금리 ${num(f.v,2)}% · 2년물 ${num(d2,2)}% (시장 기대 ${d2!=null? (d2<f.v?"인하":"동결·인상"):"–"})`;
    }
    out.push({t:"금리 사이클", c, st, d});
  }
  { const e = empLight(m); out.push({t:"고용", ...e}); }
  // 유동성
  {
    const nl = m.netliq, so = m.sofr?.v, io = m.iorb?.v;

function priceOf(t, S){ const s=S[t]; return s?.price ?? null; }
function valueAccounts(H, S, fx){
  const res = {list:[], total:0, cost:0, directTotal:0};
  if(!H) return res;
  for(const [id,a] of Object.entries(H.accounts)){
    const isKR = id==="irp"||id==="pension";
    let val=0, cost=0, risk=0; const pos=[];
    for(const p of a.positions||[]){
      const px = priceOf(p.t, S);
      const priced = px!=null;
      const cur = px ?? p.avg;
      const mul = isKR ? 1 : fx;
      const v = cur*p.q*mul, c = p.avg*p.q*(isKR?1:fx);   // 해외 원가는 현재 환율로 환산(근사)
      val+=v; cost+=c; if(p.risk!==false && (isKR? p.risk : true)) risk+=v;
      pos.push({...p, px:cur, priced, v, c, name: KR_NAMES[p.t] || S[p.t]?.name || p.t, ret: p.avg? (cur/p.avg-1)*100 : null});
    }
    const cash = (a.cash_krw||0) + (a.cash_usd||0)*fx;
    val += cash; cost += cash;
    const principal = a.principal_krw ?? cost;
    res.list.push({id, name:a.name, val, cost, principal, pnl: val-principal, ret: principal? (val/principal-1)*100 : null, cash, risk, riskPct: val? risk/val*100 : 0, pos, raw:a, principalIsCost: a.principal_krw==null});
    res.total += val; res.cost += principal;
    if(!isKR) res.directTotal += val;
  }
  return res;
}

/* ---------- 이번 달 장투 200만 ---------- */
function planLongterm(E){
  const H=E.H, s=H?.settings||{}, fx=E.fx, S=E.S;
  const budget = (s.monthly_longterm_krw||2000000)/1e4;
  const row = RULES.monthly.find(r=>E.dd>r.min) || RULES.monthly[0];
  const alloc = {...row.alloc};
  const notes = [];
  const q=E.q;
  const oh = overheat(E);
  const hot = oh.score>=2;
  const priceFirst = (E.H?.settings?.conflict_rule||"macro")==="price";
  const mv = (from,to,amt)=>{ amt=Math.min(alloc[from]||0, amt); if(amt<=0) return 0; alloc[from]-=amt; alloc[to]=(alloc[to]||0)+amt; return amt; };
  const lev = ()=> (alloc.QLD||0)+(alloc.TQQQ||0);
  // ① 거시 모드 (공격/중립/수비) — 가격 우선 원칙: 1배는 낙폭 구간에서 계속 산다, 거시는 레버리지와 '비싼 구간'의 1배만 줄인다
  if(E.mode.name==="중립"){
    if(E.stage===0){ mv("SPYM","SCHD",30); mv("QLD","SGOV",(alloc.QLD||0)/2); notes.push("거시 중립 + 평상 구간: SPYM 30만 → SCHD, QLD 절반 → SGOV."); }
    else { const l=lev()/2; mv("TQQQ","QQQM",alloc.TQQQ||0); mv("QLD","QQQM",Math.max(0,l-(alloc.TQQQ||0))); notes.push("거시 중립 + 낙폭 구간: 1배는 그대로, 레버리지 절반만 QQQM으로."); }
  } else if(E.mode.name==="수비" || (E.hy!=null && E.hy>=6)){
    const why = E.hy>=6 ? "HY 스프레드 6% 이상" : "거시 수비(빨강 2개 이상)";
    if(E.stage===4 && !priceFirst){
      const l=(alloc.QLD||0)+(alloc.TQQQ||0);
      mv("TQQQ","QQQM",alloc.TQQQ||0); mv("QLD","QQQM",alloc.QLD||0); mv("QQQM","SGOV",l/2);
      notes.push(`${why} + 폭락(-30% 이하): 레버리지 몫 절반은 QQQM, 절반은 SGOV. 반등을 완전히 놓치지 않기 위한 완화 규칙입니다.`);
    } else if(E.stage===0 || !priceFirst){
      mv("QLD","SGOV",alloc.QLD||0); mv("TQQQ","SGOV",alloc.TQQQ||0);
      mv("QQQM","SGOV",20); mv("SPYM","SCHD",30);
      notes.push(`${why} + ${priceFirst?"평상 구간(싸지 않음)":"거시 우선 설정"}: 레버리지 전액과 QQQM 20만 → SGOV, SPYM 30만 → SCHD. 1배 적립은 줄이되 끊지 않습니다.`);
    } else {
      mv("TQQQ","QQQM",alloc.TQQQ||0); mv("QLD","QQQM",alloc.QLD||0);
      notes.push(`${why}이지만 QQQ 고점 대비 ${pct(E.dd)}로 가격 신호 우선: 1배는 계속 사고 레버리지 몫만 QQQM으로.`);
    }
  }
  // ② 과열 점수
  if(hot && (alloc.QLD||0)>0){ const m=mv("QLD","SGOV",alloc.QLD); notes.push(`과열 신호 ${oh.score}개: QLD ${num(m,0)}만은 사지 않고 SGOV에 이월.`); }
  // QLD 상한 30% (장투 계좌 기준, 매수 후)
  const lt = E.acc.list.find(a=>a.id==="longterm");
  const ltVal = (lt?.val||0)/1e4;
  const curLev = (lt?.pos||[]).filter(p=>["QLD","TQQQ"].includes(p.t)).reduce((a,p)=>a+p.v,0)/1e4;
  const cap = (s.qld_cap_pct||30)/100;
  const newLev = (alloc.QLD||0)+(alloc.TQQQ||0);
  const after = ltVal + budget;
  const maxLev = Math.max(0, cap*after - curLev);
  if(!E._noCap && newLev > maxLev+0.5){
    const cut = newLev - maxLev;
    let r = cut;
    const tq = Math.min(alloc.TQQQ||0, r); if(tq){ alloc.TQQQ-=tq; r-=tq; }
    alloc.QLD = Math.max(0,(alloc.QLD||0)-r);
    alloc.QQQM += cut;
    notes.push(`QLD 상한 ${s.qld_cap_pct||30}%: 매수 후 장투 평가액 ${num(after,0)}만 기준 레버리지 한도 ${num(maxLev,0)}만 → 초과 ${num(cut,0)}만은 QQQM으로.`);
  }
  const below = E.state===3||E.state===4;
  const carry = (H?.accounts?.longterm?.qld_carry_krw||0)/1e4;
  const rows = [];
  for(const [t,man] of Object.entries(alloc)){
    if(!man) continue;
    const px = priceOf(t,S), dollars = man*1e4/fx;
    let how = "25일 지정가 또는 시장가 1회";
    if(t==="QLD"){
      how = below ? "주 1회 4분할 (200일선 아래: -2% 규칙 끔)"
        : `전일 종가 −2% 이하 예약매수(LOC ${px? usd((S.QLD.price)*0.98):"–"} 기준). QQQ RSI ≤ 50이면 2배. 월말 미집행분 절반 매수, 절반 이월(최대 120만). 검증상 매월 1회 매수와 성과 차이는 거의 없음`;
    }
    if(t==="TQQQ") how = "20거래일 분할 (총자산 10% 상한)";
    if(t==="SGOV") how = "대기 현금 — 조건 해소 시 QLD·QQQM 매수 재원";
    if(t==="SCHD") how = "25일 1회 (배당 풀)";
    rows.push({t, man, dollars, px, sh: px? dollars/px : null, how});
  }
  if(carry) notes.push(`QLD 이월분 ${num(carry,0)}만 보유 중 — 위 QLD 규칙과 같은 조건에서 함께 집행.`);
  return {row, rows, notes, budget, hot, below};
}

/* ---------- 과열 점수 (현금화) ---------- */
function overheat(E){
  // 2000~2026 QQQ·QLD 검증(data/overheat_study.json)으로 고른 신호. RSI ≥70·VIX 저점은 이후 수익이 평균 이상이라 제외.
  const q=E.q, m=E.M.macro||{};
  const six=new Date(); six.setMonth(six.getMonth()-6);
  const hikes=(m.fedu?.changes||[]).some(x=>x.delta>0 && new Date(x.date)>=six);
  const hy=m.hy?.v;
  const sig=[
    {k:"QQQ 일봉 RSI ≥ 80", on: q.rsi==null?null: q.rsi>=80, show:num(q.rsi,1)},
    {k:"QQQ 주봉 RSI ≥ 75", on: q.rsi_w==null?null: q.rsi_w>=75, show:num(q.rsi_w,1)},
    {k:"200일선 이격 ≥ +15%", on: q.vs200==null?null: q.vs200>=15, show:pct(q.vs200)},
    {k:"주봉 50주선 이격 ≥ 120%", on: q.gap50w==null?null: q.gap50w>=120, show:num(q.gap50w,1)+"%"},
    {k:"공포탐욕 ≥ 80 (극단적 탐욕)", on: E.fng==null?null: E.fng>=80, show:E.fng!=null?num(E.fng,0):"자산제곱 확인"},
  ];
  const ref={k:"참고: 경기 과열 (연준 인상기 또는 HY ≤ 2.75%)", on: hikes || (hy!=null && hy<=2.75), show: hy!=null? `HY ${num(hy,2)}%${hikes?" · 인상기":""}`:"–"};
  const score = E._oh!=null ? E._oh : sig.filter(x=>x.on).length;
  const lt = score>=3 ? "장투: QLD 보유분 20% 매도 → 현금 풀(SGOV). 1배는 매도 없음" :
             score>=2 ? "장투: 매도 없음, QLD 신규 적립 보류(→ SGOV)" : "장투: 평소대로";
  const sw = score>=4 ? "스윙: 레버리지 전량 + 개별주 절반 매도" :
             score>=3 ? "스윙: 레버리지 50% 매도" :
             score>=2 ? "스윙: 레버리지 30% 매도, 신규 진입 중단" : "스윙: 평소대로";
  return {sig, ref, score, lt, sw};
}

/* ---------- 현금 ---------- */
function planAmmo(E){
  const a = E.acc.list.find(x=>x.id==="ammo"); const raw = E.H?.accounts?.ammo || {};
  const bal = a?.val||0;
  const done = raw.tranches_done||[];
  const list = RULES.tranches.map(t=>{
    const reached = E.dd!=null && E.dd<=t.dd;
    let mix = {...t.mix};
    if(E.noLev) mix = {QQQM:100};
    return {...t, reached, done: done.includes(t.n), mix};
  });
  const next = list.find(t=>!t.done);
  let action = null;
  if(next){
    const pre = false;   // 보수적 계좌: 낙폭 도달 전 선집행 없음
    if(next.reached){
      const pctUse = next.rem;
      const amt = bal * pctUse/100;
      action = {t:next, pre, ready: E.auxN>=2 || pre, amt, pctUse, split: next.n===4? "20~40거래일" : "3~5거래일"};
    }
  }
  // 회복 정산(Ben 2026-11-08): 투입 후 QQQ가 전고점 회복(고점 대비 -1% 이내) → 현금 계좌가 산 종목(SGOV 제외)
  // 절반은 매도해 SGOV로 되돌리고, 나머지 절반은 장투 계좌로 이관. 이후 차수 초기화.
  const inv = (a?.pos||[]).filter(p=>p.t!=="SGOV");
  const invVal = inv.reduce((x,p)=>x+p.v,0);
  const atHigh = E.dd!=null && E.dd>-1;
  const settle = (done.length || invVal>0) && atHigh ? {inv, invVal, half: invVal/2} : null;
  const reset = atHigh;
  return {bal, list, next, action, reset, done, inv, invVal, settle};
}

  // 3배: 관심 조건
  for(const t of ["TQQQ","SOXL"]){ const x=S[t]; if(!x) continue;

function planPension(E){
  const amt = (E.H?.settings?.monthly_pension_krw||450000);

  let rows = tilt ? [{t:"426030",w:65},{t:"360750",w:35}] : [{t:"426030",w:55},{t:"360750",w:45}];

  if(div>0) rows = [{t:"458730",w:div}, ...rows.map(r=>({...r, w:Math.round(r.w*(100-div)/100)}))];
  const glide = by? {age, sa, div, startYear: by+sa-4} : null;
  return {amt, tilt, glide, rows: rows.map(r=>{ const px=priceOf(r.t,E.S); const won_=amt*r.w/100; return {...r, name:KR_NAMES[r.t], won:won_, px, sh: px? Math.floor(won_/px): null}; })};
}

/* ---------- 매수 창 ---------- */
function buyWindow(day=25){
  const now = new Date();
  const kst = new Date(now.getTime() + (now.getTimezoneOffset()+540)*60000);
  let y=kst.getFullYear(), m=kst.getMonth();
  const mk = (y,m)=>{ let d=new Date(y,m,day); const s=new Date(d); while(s.getDay()===0||s.getDay()===6) s.setDate(s.getDate()+1); const e=new Date(s); let n=0; while(n<3){ e.setDate(e.getDate()+1); if(e.getDay()!==0&&e.getDay()!==6) n++; } return {s,e}; };
  let w = mk(y,m);
  const today = new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  if(today > w.e) w = mk(m===11?y+1:y, (m+1)%12);
  const dd = Math.round((w.s - today)/864e5);
  const f = d=>`${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`;
  return {start:w.s, end:w.e, dday: dd, label:`${f(w.s)} ~ ${f(w.e)}`, inWindow: today>=w.s && today<=w.e};
}

function vMacro(){
  const m=E.M.macro||{};
  const cards = E.L.map(l=>`<div class="light"><div class="t">${esc(l.t)}</div><div class="st ${l.c}"><span class="dot ${l.c}"></span>${esc(l.st)}</div><div class="d">${esc(l.d)}</div></div>`).join("");
  const series = [["hy","하이일드 스프레드 (%)",[4,5,6]],["t10y2y","장단기 금리차 10Y−2Y (%p)",[0]],["icsa","신규 실업수당 청구",[250000,300000]],["netliq","순유동성 (십억$)",[]],["vix","VIX",[20,30]]];
  return `<h2>거시 신호등 · 현재 모드: ${pill(E.mode.name,E.mode.c)}</h2>
  <div class="lights">${cards}</div>
  <p class="note">거시 지표는 매수 시점이 아니라 공격·수비 모드를 정합니다. 빨강 2개 이상 → 수비(신규 레버리지 중단, 현금 1배로만). 데이터: FRED(무료). PMI·EPS 전망은 무료 소스가 없어 수동 확인 항목입니다.</p>
  <h2>공포탐욕</h2>
  <div class="panel"><p>${E.fng? `CNN 공포탐욕 <b>${num(E.fng,0)}</b> (${esc(E.M.fng.rating)}, ${esc(E.M.fng.date)}) · ` : ""}기준 값은 <a href="${RULES.fngLink}" target="_blank" rel="noopener">자산제곱 모니터링 대시보드</a>에서 확인합니다. ≤ 45 공포(현금 보조지표), ≤ 20 극단적 공포(폭락 판정), ≥ 80 과열(QLD 신규 보류).</p></div>
  <h2>추이 (2년)</h2>
  <div class="grid2">${series.map(([k,t,th])=>{ const s=m[k]?.spark; return `<div class="panel"><h3 style="margin-top:0">${t} <span class="muted">${m[k]?.v!=null? num(m[k].v, k==="icsa"?0:2):""}</span></h3>${s&&s.length>1? lineChart(s,th) : '<p class="muted">데이터 대기</p>'}</div>`; }).join("")}</div>`;
}
function lineChart(arr, th=[], h=140){
  const W=520, P=4; const a=arr.filter(x=>x!=null); const mn=Math.min(...a, ...th), mx=Math.max(...a, ...th), rg=(mx-mn)||1;
  const y=v=>(h-P-(v-mn)/rg*(h-2*P)).toFixed(1);
  const pts=a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${h}" class="chart" style="height:${h}px" preserveAspectRatio="none" role="img" aria-label="추이 차트">
  ${th.map(t=>`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#d6d3cb" stroke-dasharray="4 4"/><text x="${W-2}" y="${y(t)-3}" text-anchor="end" font-size="11" fill="#55534e">${num(t, t>1000?0:1)}</text>`).join("")}
  <polyline fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}

function vBacktest(){
  const B=DATA.bt;
  if(!B) return `<h2>백테스트</h2><div class="panel"><p>백테스트는 자동 갱신(GitHub Actions)에서 상장 이후 전체 일봉으로 계산합니다. 아직 결과 파일이 없습니다.</p>
  <p class="muted">계산 항목: ① 조던 -3% 룰(나스닥 −3% 마감 시 전량 매도, 23거래일 후 재매수, 23일 내 4회면 42일 대기, 8일 연속 상승·VIX ≤15면 조기 재진입) vs 보유 — QQQ·QLD·QQQ 3배 합성 ② QLD 월 적립: 매월 1회 vs −2% 규칙(1층) vs QQQ 1배.</p></div>`;
  const m3 = B.minus3.map(r=>`<tr><td class="l">${esc(r.label)}<div class="muted">${r.start} ~ ${r.end}</div></td><td>${pct(r.rule.cagr,1)}</td><td>${pct(r.hold.cagr,1)}</td><td>${pct(r.rule.mdd,0)}</td><td>${pct(r.hold.mdd,0)}</td><td>${num(r.rule.mult,1)}배 / ${num(r.hold.mult,1)}배</td><td>${r.sells}회</td><td>${pct(r.time_in_market,0,false)}</td></tr>`).join("");
  const dca = B.dca.map(r=>`<tr><td class="l">${esc(r.label)}<div class="muted">${r.start} ~ ${r.end}, ${r.months}개월</div></td><td>${num(r.A_qld_monthly.mult,2)}배 <span class="muted">(MDD ${pct(r.A_qld_monthly.mdd,0)})</span></td><td>${num(r.B_qld_dip2.mult,2)}배 <span class="muted">(${pct(r.B_qld_dip2.mdd,0)})</span></td><td>${num(r.C_qqq_monthly.mult,2)}배 <span class="muted">(${pct(r.C_qqq_monthly.mdd,0)})</span></td></tr>`).join("");
  return `<h2>조던 −3% 룰 vs 그냥 보유</h2>
  <div class="tbl"><table><tr><th class="l">대상</th><th>CAGR 룰</th><th>CAGR 보유</th><th>MDD 룰</th><th>MDD 보유</th><th>최종 배수</th><th>매도</th><th>보유 기간</th></tr>${m3}</table></div>
  <p class="note">신호는 나스닥 종합 일간 등락. 현금 구간 이자·세금·슬리피지 미반영(직투는 매도마다 양도세 대상). 3배 합성은 QQQ 일간 수익률×3 − 연 1% 비용 근사.</p>
  ${B.minus3[0]? `<div class="panel"><h3 style="margin-top:0">${esc(B.minus3[0].label)} 자산 곡선 (로그 아님)</h3>${dualChart(B.minus3[0].curve)}<p class="muted"><span style="color:var(--accent)">━ −3% 룰</span> · <span style="color:var(--brand)">━ 보유</span></p></div>`:""}
  <h2>QLD 월 적립 방식 비교</h2>
  <div class="tbl"><table><tr><th class="l">기간</th><th>QLD 매월 1회</th><th>QLD −2% 규칙</th><th>QQQ 매월 1회</th></tr>${dca}</table></div>
  <p class="note">배수 = 최종 평가액 ÷ 총 투입액. −2% 규칙: 월초 1단위 적립 → 전일 대비 −2% 이하 날 0.25단위(RSI ≤ 50이면 0.5) 매수, 월말 미집행분 절반 매수·이월 3단위 한도. 계산 ${esc(B.generated)}.</p>`;
}
function dualChart(c){
  const W=600,h=200,P=6; const all=c.flatMap(r=>[r[1],r[2]]); const mn=Math.min(...all), mx=Math.max(...all), rg=(mx-mn)||1;
  const y=v=>(h-P-(v-mn)/rg*(h-2*P)).toFixed(1); const x=i=>(i/(c.length-1)*W).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${h}" class="chart" preserveAspectRatio="none" role="img" aria-label="자산 곡선"><polyline fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke" points="${c.map((r,i)=>x(i)+","+y(r[2])).join(" ")}"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${c.map((r,i)=>x(i)+","+y(r[1])).join(" ")}"/></svg>`;
}

function vRules(){
  return `<h2>운용 원칙 요약</h2>
  <div class="panel"><ol class="steps">
    <li><b>계좌 역할</b>: 장투(직투, 월 200만) = QQQM·SPYM 코어 + QLD 위성(상한 30%), 1배는 팔지 않음, 과열 시 QLD 일부만 현금 풀로 · 현금(월 85만, SGOV) = QQQ −30/−40/−60/−80%에만 모은 돈의 15/20/25/40% 투입, 전고점 회복 시 산 종목 절반 현금화·절반 장투 이관 · 직투 스윙(700만) = 1배·2배 지수·섹터 ETF·빅테크 과대낙폭, 3배는 극단 구간 관심만 · IRP = 위험자산 비중 조절 + KODEX 200 음봉 매매 · 연금저축(월 45만) = 국내상장 나스닥100·S&P500 초장기 적립, 매도 없음, 수령 4년 전부터 배당형으로 단계 전환.</li>
    <li><b>QLD 3층</b>: 1층 QQQ 200일선 위 −2% 적립(과열 2개↑ 보류, RSI ≤50 2배, 월말 절반 이월) · 2층 낙폭 −10/−15/−20/−30% 현금 10/20/30/나머지 (QLD 비중 30→40→80→80+TQQQ) · 3층 30% 초과분 QQQM, 전고점 회복 시 TQQQ 전량·2층 QLD 절반 → QQQM, 과열 3개↑에서 QLD 20% → 현금 풀(연 2회).</li>
    <li><b>시장 상태</b>는 QQQ 일봉 종가로 자동 판정. 200일선 −3% 2일 연속 = 추세 이탈, +3% 2일 연속 = 회복.</li>
    <li><b>거시 신호등</b> 빨강 2개 이상 또는 HY ≥ 6% → 신규 레버리지 중단.</li>
    <li><b>나스닥 −3%</b>(조던 룰)은 장투 매도 신호로 쓰지 않음. 경보 + 스윙 신규 비중 절반, 23일 내 4회면 스윙 신규 중단.</li>
    <li><b>현금 비중</b>: 직투 1억 도달 시 스윙 계좌 현금 50%. IRP 위험자산 평상 55~60%, 폭락 70%.</li>
  </ol></div>
  <p class="note">현재 주가 기준 QQQ 주봉 RSI ${num(E.q.rsi_w,1)} · 50주선 이격 ${num(E.q.gap50w,1)}% (120% 이상이면 과열).</p>
  <h2>보유 내역 키 (암호화 사용 시)</h2>
  <div class="panel"><p class="muted">보유 내역을 공개 저장소에 올릴 때는 암호화합니다. Claude가 준 개인 키를 이 기기에 한 번 붙여넣으면 브라우저에만 저장됩니다.</p>
  <label class="muted" for="pkfile">키 파일(dashboard_key.pem) 선택</label>
  <input type="file" id="pkfile" accept=".pem,.txt,text/plain" style="margin:6px 0 10px">
  <textarea id="pk" rows="3" placeholder="또는 키 내용을 붙여넣기: -----BEGIN PRIVATE KEY----- …"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px"><button id="pksave">키 저장</button><button class="ghost" id="pkclear">키 삭제</button></div></div>`;
}

function render(){
  const h = (location.hash||"#today").slice(1);
  const view = VIEWS.find(v=>v[0]===h) ? h : "today";
  $("#nav").innerHTML = VIEWS.map(([k,t])=>`<a href="#${k}" ${k===view?'aria-current="page"':""}>${t}</a>`).join("");
  const fn = {today:vToday, plan:vPlan, crash:vCrash, scenario:vScenario, heat:vHeat, accounts:vAccounts, market:vMarket, macro:vMacro, backtest:vBacktest, rules:vRules}[view];
  try{ $("#app").innerHTML = fn() + footer(); }catch(err){ $("#app").innerHTML = `<div class="alert bad">화면 계산 오류: ${esc(err.message)}</div>`; console.error(err); }
  if(view==="rules"){
    $("#pkfile").onchange=async e=>{ const f=e.target.files[0]; if(f){ $("#pk").value=(await f.text()).trim(); } };
    $("#pksave").onclick=()=>{ try{ localStorage.setItem("holdings_key", $("#pk").value.trim()); location.reload(); }catch(e){} };
    $("#pkclear").onclick=()=>{ try{ localStorage.removeItem("holdings_key"); location.reload(); }catch(e){} };
  }
}
function footer(){ return `<footer>투자 판단 보조 도구입니다. 규칙 수치는 Band 전략 분석 초안이며 백테스트로 조정합니다. 시세는 Yahoo Finance·네이버(15분 이상 지연), 거시지표는 FRED.</footer>`; }

(async()=>{
  try{
    DATA = await load();
    E = engine(DATA);
    renderHero(); render();
    addEventListener("hashchange", ()=>{ render(); scrollTo({top:0}); });
  }catch(err){
    $("#app").innerHTML = `<div class="alert bad">데이터를 불러오지 못했습니다: ${esc(err.message)}</div>`;
  }
})();
</script>
</body>
